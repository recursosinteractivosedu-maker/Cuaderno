<div id="shell">

<script>
/* ============================================================
   ESTADO
   ============================================================ */
const NAV = [
  {id:'inicio', icon:'🏠', label:'Inicio'},
  {id:'oficial', icon:'📘', label:'Examen oficial'},
  {id:'estudiantes', icon:'📄', label:'Exámenes de estudiantes'},
  {id:'evaluaciones', icon:'🤖', label:'Evaluaciones'},
  {id:'resultados', icon:'📊', label:'Resultados'},
  {id:'grupal', icon:'👥', label:'Análisis grupal'},
  {id:'planes', icon:'📚', label:'Planes de estudio'},
  {id:'config', icon:'⚙️', label:'Configuración'},
];

let state = {
  section: 'inicio',
  officialExam: null,      // {titulo, preguntas:[...]}
  students: [],            // array of student objects
  confThresholds: {alta:90, media:70},
};

function newId(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,10); }

/* ---------- fuera de claude.ai (p. ej. Vercel) no existe window.storage: usar localStorage ---------- */
if(!window.storage){
  window.storage = {
    async get(key){ const v = localStorage.getItem('cuaderno-'+key); return v===null ? null : {key, value:v}; },
    async set(key, value){ localStorage.setItem('cuaderno-'+key, value); return {key, value}; },
  };
}

/* ---------- persistence (no images, to stay under storage limits) ---------- */
function stripImages(obj){
  const copy = JSON.parse(JSON.stringify(obj, (k,v)=> (k==='images'||k==='pageImages') ? undefined : v));
  return copy;
}
async function persist(){
  try{
    await window.storage.set('official-exam', JSON.stringify(state.officialExam||null), false);
    const lightStudents = state.students.map(s=>stripImages(s));
    await window.storage.set('students', JSON.stringify(lightStudents), false);
  }catch(e){ console.warn('No se pudo guardar', e); }
}
async function loadPersisted(){
  try{
    const ex = await window.storage.get('official-exam', false);
    if(ex && ex.value){ const parsed = JSON.parse(ex.value); if(parsed) state.officialExam = parsed; }
  }catch(e){}
  try{
    const st = await window.storage.get('students', false);
    if(st && st.value){ state.students = JSON.parse(st.value) || []; }
  }catch(e){}
}

/* ---------- toast ---------- */
function toast(msg){
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 3600);
}

/* ============================================================
   PDF -> IMÁGENES
   ============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function pdfFileToImages(file, scale){
  scale = scale || 1.6;
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const images = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext:ctx, viewport}).promise;
    images.push(canvas.toDataURL('image/png'));
  }
  return images;
}

function dataUrlToBase64(durl){ return durl.split(',')[1]; }

/* ============================================================
   AGENTE — LLAMADAS A LA API (visión)
   ============================================================ */
async function callClaudeVision(images, promptText, maxTokens){
  const content = images.map(img => ({
    type:'image',
    source:{type:'base64', media_type:'image/png', data: dataUrlToBase64(img)}
  }));
  content.push({type:'text', text: promptText});

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens: maxTokens || 4096,
      messages:[{role:'user', content}]
    })
  });
  if(!res.ok){ throw new Error('Fallo de la API: '+res.status); }
  const data = await res.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return textBlocks;
}

function parseJsonLoose(text){
  let clean = text.trim();
  clean = clean.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const first = clean.indexOf('{'); const last = clean.lastIndexOf('}');
  if(first>=0 && last>first){ clean = clean.slice(first,last+1); }
  return JSON.parse(clean);
}

const PROMPT_EXTRACT = `Eres un agente de IA especializado en analizar exámenes escaneados de matemáticas para un profesor.
Se te muestran las páginas de un EXAMEN OFICIAL (el documento fuente de verdad, con la clave de respuestas escrita a mano por el profesor).

Cada ejercicio termina con una línea que dice exactamente "Respuesta:" seguida de la respuesta oficial correcta escrita por el profesor a mano.

Tu tarea es extraer la estructura completa del examen. Responde ÚNICAMENTE con un JSON válido, sin texto adicional, sin explicación, sin marcado markdown, con este formato exacto:

{
  "titulo": "título o nombre del examen si aparece, o una descripción breve",
  "preguntas": [
    {
      "numero": 1,
      "tema": "tema o competencia evaluada, breve",
      "enunciado": "resumen breve del enunciado del ejercicio (máx 25 palabras)",
      "respuesta_oficial": "el contenido exacto escrito después de 'Respuesta:' en este ejercicio",
      "procedimiento_esperado": "descripción breve del procedimiento esperado si es visible en el examen oficial, o null si no hay procedimiento escrito",
      "valor": 1
    }
  ]
}

Reglas:
- Numera las preguntas en el orden en que aparecen.
- Si el examen no indica el valor en puntos de una pregunta, usa 1.
- Si una línea "Respuesta:" está vacía o ilegible, escribe "NO LEGIBLE" en respuesta_oficial.
- No inventes preguntas que no existan en el documento.`;

function buildGradePrompt(officialExam){
  const rubricLines = officialExam.preguntas.map(p =>
    `- Pregunta ${p.numero} (${p.tema}): respuesta oficial = "${p.respuesta_oficial}", valor = ${p.valor} punto(s)`+
    (p.criterio ? `, criterio de calificación: ${p.criterio}` : '')+
    (p.procedimiento_esperado ? `, procedimiento esperado: ${p.procedimiento_esperado}` : '')
  ).join('\n');

  return `Eres un agente de IA de evaluación formativa. Vas a calificar el examen manuscrito de UN estudiante, comparándolo contra el examen oficial del profesor.

EXAMEN OFICIAL Y CLAVE DE RESPUESTAS (fuente de verdad, no la sustituyas ni la inventes):
${rubricLines}

Se te muestran las páginas escaneadas del examen CONTESTADO por el estudiante, escrito a mano (lápiz o pluma). Cada ejercicio contiene el procedimiento del estudiante y termina con una línea "Respuesta:" seguida de su respuesta final.

Debes usar análisis visual (no solo OCR de texto) para interpretar escritura manuscrita, operaciones, fracciones, raíces, diagramas de Venn, planos cartesianos, tablas y gráficas dibujadas a mano.

Para cada pregunta compara tres elementos: (1) la respuesta oficial del profesor, (2) la respuesta final del estudiante escrita después de "Respuesta:", y (3) el procedimiento que el estudiante realizó. Usa el procedimiento para decidir si hay comprensión aunque exista un error de cálculo, error conceptual, o si la respuesta final no coincide con el procedimiento.

Si no puedes interpretar con claridad la respuesta o el procedimiento de una pregunta, NO la inventes: marca "requiere_revision": true y baja la "confianza".

También intenta identificar del encabezado del examen: nombre del estudiante, grupo, matrícula (si aparece) y fecha. Si no puedes identificar alguno con seguridad, usa null.

Responde ÚNICAMENTE con un JSON válido, sin texto adicional ni markdown, con este formato exacto:

{
  "datos_estudiante": {"nombre": "string o null", "grupo": "string o null", "matricula": "string o null", "fecha": "string o null"},
  "resultados": [
    {
      "numero": 1,
      "respuesta_estudiante": "lo que el estudiante escribió después de 'Respuesta:', o 'NO CONTESTADA' si está en blanco",
      "procedimiento_resumen": "resumen breve del procedimiento que realizó el estudiante",
      "evaluacion": "correcta | incorrecta | parcial | no_contestada",
      "puntos_obtenidos": 0,
      "justificacion": "explicación breve y clara de la calificación, en tono constructivo, dirigida al profesor",
      "tipo_error": "error_procedimiento | error_calculo | error_conceptual | confusion_signos | confusion_conceptos | falta_procedimiento | respuesta_incompleta | respuesta_ilegible | sin_contestar | ninguno",
      "confianza": 90,
      "requiere_revision": false
    }
  ],
  "retroalimentacion": {
    "fortalezas": ["frase breve", "frase breve"],
    "areas_oportunidad": ["frase breve"],
    "errores_principales": ["frase breve, en tono constructivo, sin lenguaje desmotivador"],
    "recomendaciones": "2-4 frases dirigidas directamente al estudiante, en tono motivador, indicando exactamente qué debe estudiar"
  },
  "plan_estudio": {
    "tema_prioritario": "el tema con más dificultad",
    "actividades": ["actividad concreta 1", "actividad concreta 2", "actividad concreta 3"]
  }
}

Reglas de calificación:
- puntos_obtenidos nunca debe exceder el valor de la pregunta.
- No otorgues puntos por una respuesta final correcta que claramente no se deriva del procedimiento mostrado (posible copia), señálalo en justificacion y en tipo_error.
- Sé estricto pero justo, y siempre justifica tu decisión.`;
}

/* ============================================================
   CÁLCULOS DERIVADOS
   ============================================================ */
function computeStudentScore(student){
  if(!state.officialExam || !student.resultados) return {calif:0, sobre:0, dominio:{}};
  const valorPorNum = {};
  const temaPorNum = {};
  state.officialExam.preguntas.forEach(p=>{ valorPorNum[p.numero]=p.valor; temaPorNum[p.numero]=p.tema; });

  let totalPuntos=0, totalValor=0;
  const temaAcum = {}; // tema -> {obt, pos}
  student.resultados.forEach(r=>{
    const valor = valorPorNum[r.numero] != null ? valorPorNum[r.numero] : 1;
    const tema = temaPorNum[r.numero] || 'General';
    totalPuntos += Number(r.puntos_obtenidos)||0;
    totalValor += Number(valor)||0;
    if(!temaAcum[tema]) temaAcum[tema] = {obt:0,pos:0};
    temaAcum[tema].obt += Number(r.puntos_obtenidos)||0;
    temaAcum[tema].pos += Number(valor)||0;
  });
  const dominio = {};
  Object.keys(temaAcum).forEach(t=>{
    dominio[t] = temaAcum[t].pos>0 ? Math.round((temaAcum[t].obt/temaAcum[t].pos)*100) : 0;
  });
  const calif10 = totalValor>0 ? (totalPuntos/totalValor)*10 : 0;
  return {calif: Math.round(calif10*10)/10, sobre:10, dominio, totalPuntos, totalValor};
}

function confLevel(c){
  if(c>=state.confThresholds.alta) return 'alta';
  if(c>=state.confThresholds.media) return 'media';
  return 'baja';
}
function evalTagLabel(e){
  return {correcta:'Correcta', incorrecta:'Incorrecta', parcial:'Parcial', no_contestada:'No contestada'}[e] || e;
}
function domColor(pct){
  if(pct>=75) return 'green';
  if(pct>=50) return 'amber';
  return 'red';
}
function domIcon(pct){ return pct>=75?'🟢':(pct>=50?'🟡':'🔴'); }

function groupAnalysis(){
  const temaAcum = {}; // tema -> {sumPct:[], countLow:0, countTotal:0}
  const errorTally = {};
  let sumCalif=0, n=0;
  state.students.forEach(s=>{
    if(!s.resultados) return;
    const sc = computeStudentScore(s);
    sumCalif += sc.calif; n++;
    Object.keys(sc.dominio).forEach(t=>{
      if(!temaAcum[t]) temaAcum[t]={vals:[], low:0, total:0};
      temaAcum[t].vals.push(sc.dominio[t]);
      temaAcum[t].total++;
      if(sc.dominio[t] < 70) temaAcum[t].low++;
    });
    s.resultados.forEach(r=>{
      if(r.tipo_error && r.tipo_error!=='ninguno'){
        errorTally[r.tipo_error] = (errorTally[r.tipo_error]||0)+1;
      }
    });
  });
  const temas = Object.keys(temaAcum).map(t=>{
    const avg = temaAcum[t].vals.reduce((a,b)=>a+b,0)/temaAcum[t].vals.length;
    return {tema:t, avg:Math.round(avg), low:temaAcum[t].low, total:temaAcum[t].total};
  }).sort((a,b)=>a.avg-b.avg);
  const errores = Object.entries(errorTally).sort((a,b)=>b[1]-a[1]);
  return {temas, errores, promedioGrupo: n? Math.round((sumCalif/n)*10)/10 : 0, n};
}

function renderNav(){

    if(item.id==='resultados'){
      const pend = countPendingReview();
      if(pend) badge = `<span class="nav-badge">${pend}</span>`;
    }
    div.innerHTML = `<span class="nav-icon">${item.icon}</span><span>${item.label}</span>${badge}`;
    div.onclick = ()=>{ state.section=item.id; renderAll(); };
    nav.appendChild(div);
  });
}
function countPendingReview(){
  let c=0;
  state.students.forEach(s=>{ (s.resultados||[]).forEach(r=>{ if(r.requiere_revision && !r._confirmado) c++; }); });
  return c;
}

async function runOne(id, silent){
  const s = state.students.find(x=>x.id===id);
  if(!s) return;
  if(!s.images){ toast('Este examen no tiene páginas cargadas'); return; }
  const log = document.getElementById('eval-log');
  const steps = [
    ['Observar: leyendo páginas del examen del estudiante','run'],
  ];
  if(log) log.innerHTML = `<div class="card"><h3>${s.filename}</h3>${agentLogHtml(steps)}</div>`;

  try{
    const prompt = buildGradePrompt(state.officialExam);
    steps[0]=[steps[0][0],'ok'];
    steps.push(['Analizar: interpretando escritura manuscrita y procedimientos con visión de IA…','run']);
    if(log) log.innerHTML = `<div class="card"><h3>${s.filename}</h3>${agentLogHtml(steps)}</div>`;

    const raw = await callClaudeVision(s.images, prompt, 4096);
    const parsed = parseJsonLoose(raw);

    steps[steps.length-1]=[steps[steps.length-1][0],'ok'];
    steps.push(['Decidir: comparando contra la clave oficial y aplicando la rúbrica','ok']);
    steps.push(['Ejecutar: calculando puntos por pregunta','ok']);

    s.nombre = parsed.datos_estudiante && parsed.datos_estudiante.nombre;
    s.grupo = parsed.datos_estudiante && parsed.datos_estudiante.grupo;
    s.matricula = parsed.datos_estudiante && parsed.datos_estudiante.matricula;
    s.fecha = parsed.datos_estudiante && parsed.datos_estudiante.fecha;
    s.resultados = parsed.resultados.map(r=>({...r, _confirmado:false}));
    s.retroalimentacion = parsed.retroalimentacion;
    s.plan_estudio = parsed.plan_estudio;
    s.revisadoProfesor = false;

    const lowConf = s.resultados.filter(r=>r.requiere_revision).length;
    steps.push(['Verificar: nivel de confianza por pregunta calculado'+(lowConf? ` (${lowConf} requieren tu revisión)`:''),'ok']);
    steps.push(['Reportar: diagnóstico, retroalimentación y plan de estudio generados','ok']);

    if(log) log.innerHTML = `<div class="card"><h3>${s.filename}</h3>${agentLogHtml(steps)}</div>`;
    await persist();
    renderEvalTable(); renderNav();
    if(!silent) toast('Examen de '+(s.nombre||s.filename)+' calificado');
  }catch(err){
    console.error(err);
    steps.push(['Error: '+err.message,'err']);
    if(log) log.innerHTML = `<div class="card"><h3>${s.filename}</h3>${agentLogHtml(steps)}</div>`;
  }
}

          <p style="margin:2px 0 0 0; color:var(--ink-soft);">${s.grupo? 'Grupo '+s.grupo+' · ':''}${s.matricula? 'Matrícula '+s.matricula+' · ':''}${s.fecha||''}</p>
        </div>
        <div style="text-align:right;">
          <div style="font-family:'Source Serif 4',serif; font-size:34px; font-weight:700;">${sc.calif} <span style="font-size:16px; color:var(--ink-soft);">/ 10</span></div>
          <button class="small" onclick="markReviewed('${s.id}')">${s.revisadoProfesor? '✓ Marcado como revisado':'Marcar examen como revisado'}</button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="grid-2">
        <div>
          <h3>Resultados por pregunta</h3>
          <div class="pill-row">${s.resultados.map(r=>`<span class="pill">P${r.numero} ${r.evaluacion==='correcta'?'✓':r.evaluacion==='incorrecta'?'✗':'~'} ${r.puntos_obtenidos}</span>`).join('')}</div>
        </div>
        <div>
          <h3>Dominio por tema</h3>
          ${dominioHtml || '<span style="color:var(--ink-faint);">Sin datos de tema</span>'}
        </div>
      </div>
      <div class="divider"></div>
      <div class="grid-2">
        <div class="card" style="margin:0;">
          <h3>Retroalimentación</h3>
          <p><strong>Fortalezas:</strong> ${(fb.fortalezas||[]).join('; ')||'—'}</p>
          <p><strong>Áreas de oportunidad:</strong> ${(fb.areas_oportunidad||[]).join('; ')||'—'}</p>
          <p><strong>Errores principales:</strong> ${(fb.errores_principales||[]).join('; ')||'—'}</p>
          <p>${fb.recomendaciones||''}</p>
        </div>
        <div class="card" style="margin:0;">
          <h3>Plan de estudio</h3>
          <p><strong>Tema prioritario:</strong> ${plan.tema_prioritario||'—'}</p>
          <ol>${(plan.actividades||[]).map(a=>`<li>${a}</li>`).join('')}</ol>
        </div>
      </div>
      <div class="divider"></div>
      <h3>Detalle por pregunta</h3>
      ${questionsHtml}
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="secondary" onclick="exportStudentPDF('${s.id}')">Descargar reporte individual (PDF)</button>
        <button class="secondary" onclick="closeStudentDetail()">Cerrar</button>
      </div>
    </div>
  `;
}
function closeStudentDetail(){ selectedStudentId=null; renderResultados(document.getElementById('main')); }
function editPoints(sid, idx, val){
  const s = state.students.find(x=>x.id===sid);
  s.resultados[idx].puntos_obtenidos = parseFloat(val)||0;
  persist(); openStudentDetail(sid); renderResultadosTable();
}
function editEval(sid, idx, val){
  const s = state.students.find(x=>x.id===sid);
  s.resultados[idx].evaluacion = val;
  persist(); openStudentDetail(sid); renderResultadosTable();
}
function confirmQuestion(sid, idx){
  const s = state.students.find(x=>x.id===sid);
  s.resultados[idx]._confirmado = true;
  s.resultados[idx].requiere_revision = false;
  persist(); openStudentDetail(sid); renderNav();
}
function markReviewed(sid){
  const s = state.students.find(x=>x.id===sid);
  s.revisadoProfesor = !s.revisadoProfesor;
  persist(); openStudentDetail(sid); renderResultadosTable(); renderNav();
}

function exportStudentPDF(sid){
  const s = state.students.find(x=>x.id===sid);
  const sc = computeStudentScore(s);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  let y=18;
  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Reporte individual de evaluación', 14, y); y+=8;
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text(`Estudiante: ${s.nombre||s.filename}`, 14, y); y+=6;
  if(s.grupo){ doc.text(`Grupo: ${s.grupo}`, 14, y); y+=6; }
  doc.text(`Calificación: ${sc.calif} / 10`, 14, y); y+=10;

  doc.setFont('helvetica','bold'); doc.text('Resultados por pregunta', 14, y); y+=6;
  doc.setFont('helvetica','normal');
  s.resultados.forEach(r=>{
    const line = `P${r.numero} — ${evalTagLabel(r.evaluacion)} — ${r.puntos_obtenidos} pts — ${r.justificacion||''}`;
    const split = doc.splitTextToSize(line, 180);
    if(y+split.length*5 > 280){ doc.addPage(); y=18; }
    doc.text(split, 14, y); y += split.length*5 + 2;
  });

  y+=4; if(y>260){ doc.addPage(); y=18; }
  doc.setFont('helvetica','bold'); doc.text('Dominio por tema', 14, y); y+=6;
  doc.setFont('helvetica','normal');
  Object.entries(sc.dominio).forEach(([tema,pct])=>{
    doc.text(`${tema}: ${pct}%`, 14, y); y+=5.5;
  });

  y+=4; if(y>250){ doc.addPage(); y=18; }
  const fb = s.retroalimentacion||{};
  doc.setFont('helvetica','bold'); doc.text('Retroalimentación', 14, y); y+=6;
  doc.setFont('helvetica','normal');
  const fbLines = doc.splitTextToSize(fb.recomendaciones||'', 180);
  doc.text(fbLines, 14, y); y += fbLines.length*5+6;

  const plan = s.plan_estudio||{};
  if(y>250){ doc.addPage(); y=18; }
  doc.setFont('helvetica','bold'); doc.text('Plan de estudio — '+(plan.tema_prioritario||''), 14, y); y+=6;
  doc.setFont('helvetica','normal');
  (plan.actividades||[]).forEach((a,i)=>{
    const l = doc.splitTextToSize(`${i+1}. ${a}`,180);
    doc.text(l,14,y); y+=l.length*5+1;
  });

  doc.save(`reporte_${(s.nombre||s.filename).replace(/\s+/g,'_')}.pdf`);
}

function exportGroupCSV(){
  const rows = [['Estudiante','Grupo','Calificacion','Fortalezas','Tema a reforzar','Estado']];
  state.students.filter(s=>s.resultados).forEach(s=>{
    const sc = computeStudentScore(s);
    const fortalezas = (s.retroalimentacion&&s.retroalimentacion.fortalezas||[]).join(' | ');
    const temaDebil = Object.entries(sc.dominio).sort((a,b)=>a[1]-b[1])[0];
    rows.push([s.nombre||s.filename, s.grupo||'', sc.calif, fortalezas, temaDebil?temaDebil[0]:'', s.revisadoProfesor?'Revisado':'Pendiente']);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='resultados_grupo.csv'; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- ANÁLISIS GRUPAL ---------------- */
function renderGrupal(main){
  const graded = state.students.filter(s=>s.resultados);
  if(!graded.length){
    main.innerHTML = `<div class="page-head"><div><div class="eyebrow">GRUPO COMPLETO</div><h1>Análisis grupal</h1></div></div>
    <div class="empty"><strong>Aún no hay exámenes calificados.</strong>El análisis grupal aparecerá aquí cuando el agente haya calificado al menos un examen.</div>`;
    return;
  }
  const ga = groupAnalysis();
  const peor = ga.temas[0];
  const mejor = ga.temas[ga.temas.length-1];

  main.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">GRUPO COMPLETO · ${ga.n} estudiantes evaluados</div>
      <h1>Análisis grupal</h1>
      <p>Comportamiento del grupo por tema, con base en todos los exámenes ya calificados.</p></div>
      <button class="secondary" onclick="exportGroupCSV()">Exportar CSV</button>
    </div>
    <div class="grid-3">
      <div class="stat"><div class="num">${ga.promedioGrupo}</div><div class="label">Promedio del grupo (sobre 10)</div></div>
      <div class="stat"><div class="num" style="font-size:19px;">${peor?peor.tema:'—'}</div><div class="label">Tema con mayor dificultad</div></div>
      <div class="stat"><div class="num" style="font-size:19px;">${mejor?mejor.tema:'—'}</div><div class="label">Tema con mayor dominio</div></div>
    </div>

    <div class="card">
      <h3>Dominio por tema</h3>
      ${ga.temas.map(t=>`
        <div style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; font-size:13px;">
            <span>${domIcon(t.avg)} ${t.tema}</span>
            <span>${t.avg}% de dominio promedio — ${t.low} de ${t.total} estudiantes con dificultad</span>
          </div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${t.avg}%; background:var(--${domColor(t.avg)});"></div></div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>Errores más frecuentes en el grupo</h3>
      ${ga.errores.length? `<table><thead><tr><th>Tipo de error</th><th>Frecuencia</th></tr></thead><tbody>
        ${ga.errores.map(([tipo,count])=>`<tr><td>${errorLabel(tipo)}</td><td>${count}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">Sin errores registrados.</div>'}
    </div>

    <div class="card">
      <h3>Recomendación del agente para el profesor</h3>
      <p style="font-size:15px;">${peor ? `El tema que requiere mayor atención en el grupo es <strong>${peor.tema}</strong>: ${peor.low} de ${peor.total} estudiantes presentan dificultades (dominio promedio ${peor.avg}%). Se recomienda dedicar una sesión de reforzamiento antes de avanzar al siguiente contenido.` : 'Aún no hay suficiente información para generar una recomendación.'}</p>
      ${mejor && mejor.tema!==peor.tema ? `<p style="color:var(--ink-soft);">En contraste, el grupo muestra buen dominio en <strong>${mejor.tema}</strong> (${mejor.avg}%), por lo que puede avanzarse con confianza en ese tema.</p>`:''}
    </div>
  `;
}
function errorLabel(tipo){
  const map = {error_procedimiento:'Error de procedimiento', error_calculo:'Error de cálculo', error_conceptual:'Error conceptual',
    confusion_signos:'Confusión de signos', confusion_conceptos:'Confusión de conceptos', falta_procedimiento:'Falta de procedimiento',
    respuesta_incompleta:'Respuesta incompleta', respuesta_ilegible:'Respuesta ilegible', sin_contestar:'Pregunta sin contestar'};
  return map[tipo]||tipo;
}

/* ---------------- PLANES DE ESTUDIO ---------------- */
function renderPlanes(main){
  const graded = state.students.filter(s=>s.plan_estudio);
  main.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">SEGUIMIENTO</div>
      <h1>Planes de estudio</h1>
      <p>Un plan personalizado por estudiante, generado a partir de sus errores específicos.</p></div>
    </div>
    ${!graded.length? '<div class="empty"><strong>Aún no hay planes generados.</strong>Aparecerán aquí después de calificar exámenes en "Evaluaciones".</div>' :
      graded.map(s=>`
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">${s.nombre||s.filename}</h3>
            <span class="pill">Prioridad: ${s.plan_estudio.tema_prioritario||'—'}</span>
          </div>
          <ol>${(s.plan_estudio.actividades||[]).map(a=>`<li>${a}</li>`).join('')}</ol>
          <button class="secondary small" onclick="state.section='resultados'; renderAll(); openStudentDetail('${s.id}');">Ver reporte completo</button>
        </div>`).join('')
    }
  `;
}

/* ---------------- CONFIGURACIÓN ---------------- */
function renderConfig(main){
  main.innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">AJUSTES</div><h1>Configuración</h1>
      <p>Parámetros del agente y notas de arquitectura.</p></div>
    </div>
    <div class="card">
      <h3>Umbrales de confianza</h3>
      <div class="grid-2">
        <div><label>Alta confianza desde (%)</label><input type="number" value="${state.confThresholds.alta}" onchange="state.confThresholds.alta=parseInt(this.value); renderAll();"></div>
        <div><label>Confianza media desde (%)</label><input type="number" value="${state.confThresholds.media}" onchange="state.confThresholds.media=parseInt(this.value); renderAll();"></div>
      </div>
      <p style="color:var(--ink-soft); font-size:12.5px; margin-top:8px;">Por debajo del umbral medio, la respuesta se marca automáticamente como "requiere revisión".</p>
    </div>
    <div class="card">
      <h3>Arquitectura</h3>
      <p style="color:var(--ink-soft);">Separación de responsabilidades de este agente:</p>
      <ul style="color:var(--ink-soft);">
        <li><strong>Frontend</strong> — esta interfaz (HTML/CSS/JS).</li>
        <li><strong>Procesamiento de archivos</strong> — pdf.js convierte cada página del PDF en una imagen.</li>
        <li><strong>Visión / interpretación</strong> — modelo Claude con capacidad de visión (claude-sonnet-4-6), vía la API de Anthropic.</li>
        <li><strong>Motor de evaluación</strong> — funciones de cálculo de puntos, dominio por tema y calificación final.</li>
        <li><strong>Lógica del agente</strong> — ciclo Observar → Analizar → Decidir → Ejecutar → Verificar → Reportar en cada evaluación.</li>
        <li><strong>Base de datos</strong> — almacenamiento persistente del navegador (resultados y configuración; las imágenes de los exámenes se mantienen solo en la sesión actual, por tamaño).</li>
        <li><strong>API de IA</strong> — en este entorno la llamada a la API de Anthropic se realiza sin exponer ninguna clave en el código. Si esta aplicación se despliega fuera de este entorno, la llamada a la API debe hacerse desde un servidor propio, con la clave guardada como variable de entorno del lado del servidor — nunca en el HTML/JS del cliente.</li>
      </ul>
    </div>
    <div class="card">
      <h3>Datos</h3>
      <p style="color:var(--ink-soft);">Borra toda la información cargada (examen oficial, estudiantes y calificaciones) en este navegador.</p>
      <button class="danger" onclick="resetAll()">Borrar todos los datos</button>
    </div>
  `;
}
async function resetAll(){
  if(!confirm('¿Borrar el examen oficial, todos los estudiantes y calificaciones? Esta acción no se puede deshacer.')) return;
  state.officialExam=null; state.students=[];
  await persist();
  renderAll();
  toast('Datos borrados');
}

/* ============================================================
   ARRANQUE
   ============================================================ */
async function init(){
  await loadPersisted();
  renderAll();
}
init();
</script>

</html>
